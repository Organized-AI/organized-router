# Self-hosted caching gateway. CONFIG/wrangler.product-plan.toml describes the larger
# proposed billing/healing product; this config needs only a Durable Object.
name = "organized-router-cache"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROUTER_CACHE"
class_name = "RouterCache"

[[migrations]]
tag = "cache-v1"
new_sqlite_classes = ["RouterCache"]

# Configure ROUTER_CONFIG, PROVIDER_KEYS and GATE_API_KEY with Wrangler secrets.
# Optional multi-key authorization uses USERS KV; see DOCUMENTATION/CACHING.md.
